services:

     fdp:
         image: fairdata/fairdatapoint:latest
         restart: unless-stopped
         volumes:
             - ./application.yml:/fdp/application.yml:ro
         environment:
             - INSTANCE_CLIENTURL=http://localhost:8085
             - INSTANCE_PERSISTENTURL=http://localhost:8085
             - PING_ENABLED=false
             - FDP_JWT_SECRET_KEY=fair-course-group03-local-jwt-secret-key-2026-abcdefghijklmnop
             - SECURITY_JWT_TOKEN_SECRETKEY=fair-course-group03-local-jwt-secret-key-2026-abcdefghijklmnop
         depends_on:
             - mongo
             - graphdb

     fdp-client:
         image: fairdata/fairdatapoint-client:latest
         restart: unless-stopped
         ports:
             - 8085:80
         environment:
             - FDP_HOST=fdp
         depends_on:
             - fdp

     mongo:
         image: mongo:7
         restart: unless-stopped
         ports:
             - 27017:27017
         volumes:
             - ./mongo/data:/data/db

     graphdb:
         image: ontotext/graphdb:10.7.4
         restart: unless-stopped
         ports:
             - 7200:7200
         volumes:
             - ./graphdb/home:/opt/graphdb/home